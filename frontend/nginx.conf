server {
    listen 80;

    # Serve Vue 3 SPA — fallback to index.html for client-side routing
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy all API calls to the backend App Service
    location /api/ {
        proxy_pass https://allai-dcg7ekbbexdhh6gu.japaneast-01.azurewebsites.net;
        proxy_set_header Host allai-dcg7ekbbexdhh6gu.japaneast-01.azurewebsites.net;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
    }
}
