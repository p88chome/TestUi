# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - Allai

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: allai-api-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create and Start virtual environment and Install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt

      # ✅ Verify Python imports are valid before packaging
      # DATABASE_URL is mocked because pydantic Settings() requires it at import time
      - name: Verify app imports
        env:
          DATABASE_URL: "postgresql://ci_mock:ci_mock@localhost/ci_mock"
        run: |
          source antenv/bin/activate
          python -c "
          import sys
          sys.path.insert(0, '.')
          from sqlalchemy import inspect, create_engine
          print('SQLAlchemy imports OK')
          import app.models
          print('app.models imports OK')
          print('All critical imports verified.')
          "

      # 🎯 Only package backend-relevant files to minimize artifact size
      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !antenv/
            !frontend/
            !archive/
            !global_skills/
            !node_modules/
            !.git/
            !*.pptx
            !*.db
            !*.sqlite3
            !test_*.py
            !verify_*.py
            !debug_*.py
            !check_*.py
            !seed_*.py

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_96A0BBBF2F614A3EAEE862C8E9A932FD }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_90B8CD1F7299405CB96F3C60A63D5197 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D35393A26A1046AD9614A0F17A8BA228 }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'Allai'
          slot-name: 'Production'